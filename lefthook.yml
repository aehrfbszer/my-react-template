pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm dlx oxlint {staged_files}
      glob: "*.{js,ts,jsx,tsx}"

    - name: fmt
      glob: "*.{js,ts,jsx,tsx,json}"
      run: pnpm dlx oxfmt --write {staged_files}
      stage_fixed: true
